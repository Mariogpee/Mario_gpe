  /* subtle grain */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
    opacity:0.4;
  }

  .wrap{
    width:100%;
    max-width: 440px;
    padding: 64px 28px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:1;
  }

  .eyebrow{
    font-family:'Oswald', sans-serif;
    font-weight:400;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--grey);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp .7s ease forwards;
  }

  .avatar{
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 22px 0 18px;
    border: 1.5px solid rgba(255,47,47,0.55);
    box-shadow: 0 0 0 6px rgba(200,28,28,0.06), 0 0 28px rgba(200,28,28,0.25);
    overflow:hidden;
    background: radial-gradient(circle at 35% 30%, rgba(200,28,28,0.18), rgba(10,7,7,0.4));
    opacity:0;
    animation: fadeUp .7s ease .08s forwards;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size: 44px;
    letter-spacing: 2px;
    line-height: 1;
    text-transform:uppercase;
    text-align:center;
    color: var(--cream);
    text-shadow: 0 0 24px rgba(255,47,47,0.35), 0 0 2px rgba(0,0,0,0.6);
    opacity:0;
    animation: fadeUp .7s ease .16s forwards;
  }

  .signature{
    font-family:'Dancing Script', cursive;
    font-weight:600;
    font-size: 19px;
    color: var(--red-bright);
    margin-top: 4px;
    opacity:0;
    animation: fadeUp .7s ease .24s forwards;
  }

  .rule{
    width: 54px;
    height: 2px;
    margin: 22px 0 30px;
    background: linear-gradient(90deg, transparent, var(--red-bright), transparent);
    box-shadow: 0 0 12px var(--red-bright);
    opacity:0;
    animation: fadeUp .7s ease .3s forwards;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap: 14px;
    width:100%;
    padding: 16px 20px;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(24,12,12,0.55), rgba(12,6,6,0.65));
    border: 1px solid rgba(200,28,28,0.28);
    backdrop-filter: blur(6px);
    text-decoration:none;
    color: var(--cream);
    position:relative;
    overflow:hidden;
    transition: border-color .25s ease, transform .2s ease, box-shadow .25s ease, background .25s ease;
    opacity:0;
    animation: fadeUp .6s ease forwards;
  }

  .link-btn:nth-of-type(1){ animation-delay: .38s; }
  .link-btn:nth-of-type(2){ animation-delay: .46s; }
  .link-btn:nth-of-type(3){ animation-delay: .54s; }
  .link-btn:nth-of-type(4){ animation-delay: .62s; }

  .link-btn:hover, .link-btn:focus-visible{
    border-color: var(--red-bright);
    transform: translateY(-2px);
    box-shadow: 0 6px 26px rgba(200,28,28,0.28), 0 0 0 1px rgba(255,47,47,0.15) inset;
    background: linear-gradient(180deg, rgba(36,14,14,0.7), rgba(16,7,7,0.75));
  }
  .link-btn:focus-visible{ outline: 2px solid var(--red-bright); outline-offset: 3px; }

  .icon{
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    color: var(--red-bright);
  }
  .icon svg{ width:100%; height:100%; fill:currentColor; }

  .label{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform:uppercase;
  }

  .sub{
    font-family:'Inter', sans-serif;
    font-size: 12px;
    color: var(--grey);
    margin-top: 1px;
  }

  .label-col{ display:flex; flex-direction:column; gap:2px; }

  .arrow{
    margin-left:auto;
    font-size: 16px;
    color: rgba(242,236,230,0.35);
    transition: transform .2s ease, color .2s ease;
  }
  .link-btn:hover .arrow{ transform: translateX(3px); color: var(--red-bright); }

  footer{
    margin-top: 46px;
    font-family:'Oswald', sans-serif;
    font-size: 10.5px;
    letter-spacing: 3px;
    color: rgba(154,140,140,0.6);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp .7s ease .74s forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; opacity:1 !important; transform:none !important; }
  }

  @media (max-width: 380px){
    h1{ font-size: 36px; }
    .wrap{ padding: 48px 22px 32px; }
  }
</style>
</head>
<body>
